{% extends "base.html" %}
{% block title %}ChessArena · New match{% endblock %}
{% block content %}
<h1>Create match</h1>

<form method="post" action="{{ settings.base_path }}/admin/tournaments" class="panel">
  <input type="hidden" name="_csrf_token" value="{{ request.state.csrf_token }}">
  <label>Match name
    <input type="text" name="name" required maxlength="200" placeholder="Production vs Stockfish Limited 2000">
  </label>

  <h3>Engine A</h3>
  <label>Preset
    <select name="engine_a_preset" required>
      {% for p in presets %}
        <option value="{{ p.preset_id }}"
          {% if p.preset_id == (defaults.engine_a_preset or "chessengine-production") %}selected{% endif %}>
          {{ p.display_name }} ({{ p.build_id }})
        </option>
      {% endfor %}
    </select>
  </label>
  <label id="elo-a-wrap" class="custom-elo" style="display:none">Custom Elo (optional) <span class="muted">— per-match override, no preset is created</span>
    <input type="number" name="engine_a_elo" min="1" value="{{ defaults.engine_a_elo }}"
      placeholder="Allowed range shown below">
    <span class="muted" id="elo-a-range"></span>
  </label>

  <h3>Engine B</h3>
  <label>Preset
    <select name="engine_b_preset" required>
      {% for p in presets %}
        <option value="{{ p.preset_id }}"
          {% if p.preset_id == (defaults.engine_b_preset or "chessengine-legacy-current") %}selected{% endif %}>
          {{ p.display_name }} ({{ p.build_id }})
        </option>
      {% endfor %}
    </select>
  </label>
  <label id="elo-b-wrap" class="custom-elo" style="display:none">Custom Elo (optional) <span class="muted">— per-match override, no preset is created</span>
    <input type="number" name="engine_b_elo" min="1" value="{{ defaults.engine_b_elo }}"
      placeholder="Allowed range shown below">
    <span class="muted" id="elo-b-range"></span>
  </label>

  <p id="same-preset-warning" class="danger" style="display:none">
    Warning: both sides use the same engine preset.
  </p>
  <label style="display:none" id="allow-selfplay-wrap">
    <input type="checkbox" name="allow_intentional_self_play">
    Allow intentional self-play
  </label>

  <h3>Configuration</h3>
  <label>Opening set
    <select name="opening_set_id" required>
      {% for o in openings %}
        <option value="{{ o.opening_set_id }}"
          {% if o.opening_set_id == (defaults.opening_set_id or "stockfish-8moves-v3") %}selected{% endif %}>
          {{ o.opening_set_id }} ({{ o.position_count }} positions)
        </option>
      {% endfor %}
    </select>
  </label>
  <label>Opening plies <span class="muted">(PGN books only — 16 plies = 8 full moves, 12 plies = 6 full moves)</span>
    <input type="number" name="opening_plies" min="1" value="{{ defaults.opening_plies }}" placeholder="16 (book default)">
  </label>
  <label>Opening seed <span class="muted">(optional — deterministic reproducible selection)</span>
    <input type="number" name="opening_seed" min="0" placeholder="random">
  </label>
  <label>Time control
    <select name="time_control" required>
      {% for key, tc in time_controls.items() %}
        <option value="{{ key }}"
          {% if key == (defaults.time_control or "blitz_3_2") %}selected{% endif %}>{{ tc.label }} ({{ tc.cutechess_tc }})</option>
      {% endfor %}
    </select>
  </label>
  <label>Pairs (each pair = 2 games, strict color swap)
    <input type="number" name="pairs" min="1" value="{{ defaults.pairs or 10 }}" required>
  </label>
  <label>
    <input type="checkbox" name="arena_elo_enabled">
    Rated match <span class="muted">(counts toward Arena Elo — leave off for smoke/UI matches)</span>
  </label>

  <button type="submit">Create match</button>
</form>

<script>
(function () {
  var PRESET_ELO = {{ preset_elo | tojson }};
  var a = document.querySelector('select[name="engine_a_preset"]');
  var b = document.querySelector('select[name="engine_b_preset"]');
  var warn = document.getElementById('same-preset-warning');
  var wrap = document.getElementById('allow-selfplay-wrap');

  function eloEls(side) {
    return {
      wrap: document.getElementById('elo-' + side + '-wrap'),
      input: document.querySelector('input[name="engine_' + side + '_elo"]'),
      range: document.getElementById('elo-' + side + '-range'),
    };
  }
  function refreshElo(side, presetId) {
    var limit = PRESET_ELO[presetId];
    var els = eloEls(side);
    if (!limit) {
      els.wrap.style.display = 'none';
      els.input.removeAttribute('min');
      els.input.removeAttribute('max');
      els.range.textContent = '';
      return;
    }
    els.wrap.style.display = 'block';
    if (limit.min != null) { els.input.setAttribute('min', limit.min); }
    if (limit.max != null) { els.input.setAttribute('max', limit.max); }
    els.range.textContent = 'Allowed: ' + limit.min + '\u2013' + limit.max;
  }
  function refresh() {
    var same = a.value === b.value;
    warn.style.display = same ? 'block' : 'none';
    wrap.style.display = same ? 'block' : 'none';
    refreshElo('a', a.value);
    refreshElo('b', b.value);
  }
  a.addEventListener('change', refresh);
  b.addEventListener('change', refresh);
  refresh();
})();
</script>
{% endblock %}
